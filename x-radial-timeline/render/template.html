<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__TITLE__</title>
<style>
  /*__FONTS__*/
  :root {
    /* Atlas tokens (apps/web/app/globals.css) */
    --paper: #fbfaf7; --bg-alt: #f2eee6; --rule: #e5dfd0; --rule-soft: #efeae0;
    --ink: #0e1525; --ink-soft: #363d4e; --ink-muted: #8a8576;
    --core: #0e1525; --core-text: #fbfaf7; --core-muted: #a9a596;
    --blue: #1f46ff;
    /* categorical, validated on the paper surface (dataviz validator): post, reply, repost, quote */
    --c-post: #1f46ff; --c-reply: #d85a2a; --c-repost: #8b3fa0; --c-quote: #c99a3d;
    /* sequential blue ramp for the engagement ring */
    --h0: #f2eee6; --h1: #e5ebff; --h2: #c7d2ff; --h3: #9fb0ff; --h4: #5b73ff; --h5: #1f46ff; --h6: #0f2aa8;
    --sans: "Geist", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  }
  :root[data-theme="ink"] {
    --paper: #0e1525; --bg-alt: #161e30; --rule: #2a3142; --rule-soft: #1d2538;
    --ink: #fbfaf7; --ink-soft: #d9d4c7; --ink-muted: #8a8576;
    --core: #fbfaf7; --core-text: #0e1525; --core-muted: #6b6a62;
    --c-post: #4f68f0; --c-reply: #cf5526; --c-repost: #9a52ae; --c-quote: #b98b36; /* validated on #0e1525 */
    --h0: #161e30; --h1: #1a2440; --h2: #223065; --h3: #2d4291; --h4: #3f5ad0; --h5: #5b73ff; --h6: #9fb0ff;
  }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  body { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 0 16px 48px; box-sizing: border-box; }
  #stage { width: min(100vw, 1200px); aspect-ratio: 1; position: relative; }
  #stage svg { width: 100%; height: 100%; display: block; }
  svg text { font-family: var(--sans); fill: var(--ink); }
  svg .mono { font-family: var(--mono); font-feature-settings: "tnum"; }
  svg .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; fill: var(--blue); }
  svg .muted { fill: var(--ink-muted); }
  svg .soft { fill: var(--ink-soft); }
  .seg { stroke-linecap: butt; }
  .hit { fill: transparent; cursor: default; }
  .hit:focus { outline: none; }
  #tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); font: 12px/1.45 var(--sans); padding: 10px 12px; border-radius: 6px; max-width: 240px; opacity: 0; transition: opacity 120ms; box-shadow: 0 6px 20px rgba(14,21,37,.18); }
  #tip b { font-weight: 600; }
  #tip .row { display: flex; justify-content: space-between; gap: 16px; font-family: var(--mono); font-size: 11px; }
  #tip .k { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  details { width: min(100vw - 32px, 1200px); font-size: 13px; color: var(--ink-soft); }
  summary { cursor: pointer; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
  th:first-child, td:first-child { text-align: left; }
  th { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { #tip { transition: none; } }
</style>
</head>
<body>
<div id="stage"><div id="tip" role="status"></div></div>
<details><summary>Data table · 52 weeks</summary><div id="table"></div></details>
<script>
const DATA = __DATA__;
const AVATAR = __AVATAR__;
(function () {
  const Q = new URLSearchParams(location.search);
  if (Q.get('theme')) document.documentElement.dataset.theme = Q.get('theme');

  // ---------- geometry ----------
  const S = 1200, CX = 600, CY = 600;
  const GAP = 18;                                   // degrees left open at 12 o'clock (gridline labels live here)
  const R = { core: 112, monthIn: 150, monthOut: 176, heatIn: 188, heatOut: 214, barIn: 232, barOut: 536 };
  const BAR_W = 13, SEG_GAP = 2;
  const N = DATA.weeks, SWEEP = 360 - GAP;
  const TYPES = ['post', 'reply', 'repost', 'quote'];
  const LABEL = { post: 'Posts', reply: 'Replies', repost: 'Reposts', quote: 'Quotes' };
  const COLOR = { post: 'var(--c-post)', reply: 'var(--c-reply)', repost: 'var(--c-repost)', quote: 'var(--c-quote)' };
  const HEAT = ['var(--h1)', 'var(--h2)', 'var(--h3)', 'var(--h4)', 'var(--h5)', 'var(--h6)'];
  const rad = (d) => (d * Math.PI) / 180;
  const pt = (r, a) => [CX + r * Math.cos(rad(a)), CY + r * Math.sin(rad(a))];
  const angleOfWeek = (i, f = 0.5) => -90 + GAP / 2 + ((i + f) * SWEEP) / N;    // clockwise from top
  const angleOfTime = (t) => -90 + GAP / 2 + ((t - since) / (until - since)) * SWEEP;
  const since = +new Date(DATA.since), until = +new Date(DATA.until);
  const f2 = (n) => n.toFixed(2);
  function sector(r0, r1, a0, a1) {
    const [x0, y0] = pt(r1, a0), [x1, y1] = pt(r1, a1), [x2, y2] = pt(r0, a1), [x3, y3] = pt(r0, a0);
    const big = a1 - a0 > 180 ? 1 : 0;
    return `M${f2(x0)} ${f2(y0)}A${r1} ${r1} 0 ${big} 1 ${f2(x1)} ${f2(y1)}L${f2(x2)} ${f2(y2)}A${r0} ${r0} 0 ${big} 0 ${f2(x3)} ${f2(y3)}Z`;
  }
  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(n);
  const num = (n) => Math.round(n).toLocaleString('en-US');
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const dShort = (iso) => { const d = new Date(iso + 'T00:00:00Z'); return MON[d.getUTCMonth()] + ' ' + d.getUTCDate(); };
  const range = (w) => { const a = new Date(w.start + 'T00:00:00Z'), b = new Date(w.end + 'T00:00:00Z'); return MON[a.getUTCMonth()] + ' ' + a.getUTCDate() + '–' + (a.getUTCMonth() === b.getUTCMonth() ? '' : MON[b.getUTCMonth()] + ' ') + b.getUTCDate(); };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- data prep ----------
  const W = DATA.weekly.map((w) => ({ ...w, total: w.post + w.reply + w.repost + w.quote }));
  const maxTotal = Math.max(1, ...W.map((w) => w.total));
  const steps = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000];
  const step = steps.find((s) => maxTotal / s <= 5) || 1000;
  const niceMax = Math.ceil(maxTotal / step) * step;
  const pxPer = (R.barOut - R.barIn) / niceMax;
  const maxLikes = Math.max(1, ...W.map((w) => w.likes));
  // Coverage: X serves only the most recent ~3,200 items, so a heavy poster's `oldest` lands inside the window.
  const coverStart = Math.max(since, DATA.oldest ? +new Date(DATA.oldest) : since);
  const coverDay = DATA.oldest && +new Date(DATA.oldest) > since ? DATA.oldest.slice(0, 10) : null; // null = the whole window is covered
  const covered = (w) => !coverDay || w.start >= coverDay;                                            // whole weeks only
  const nCovered = W.filter(covered).length;
  const partial = nCovered < N;
  const heatIdx = (likes) => likes <= 0 ? -1 : Math.min(5, Math.floor(Math.sqrt(likes / maxLikes) * 5.999));
  const peak = W.reduce((a, w, i) => (covered(w) && w.total > W[a].total ? i : a), W.findIndex(covered));
  const peakLikes = W.reduce((a, w, i) => (covered(w) && w.likes > W[a].likes ? i : a), W.findIndex(covered));
  const TOT = { post: 0, reply: 0, repost: 0, quote: 0, likes: 0, reposts: 0, replies: 0, quotes: 0 };
  for (const w of W) if (covered(w)) for (const k in TOT) TOT[k] += w[k];
  const total = TOT.post + TOT.reply + TOT.repost + TOT.quote;
  const u = DATA.user || {};
  const handle = '@' + (u.handle || DATA.handle);

  // month boundaries inside the window
  const months = [];
  { const d = new Date(since); d.setUTCDate(1); d.setUTCHours(0, 0, 0, 0); d.setUTCMonth(d.getUTCMonth() + 1);
    for (; +d < until; d.setUTCMonth(d.getUTCMonth() + 1)) months.push(+d); }
  const monthSpans = [];
  { let prev = since; for (const m of [...months, until]) { monthSpans.push({ from: prev, to: m, label: MON[new Date(prev).getUTCMonth()] }); prev = m; } }

  // ---------- timeline ----------
  const T = { intro: [0, 0.1], sweep: [0.1, 0.8], dur: 0.07, outro: [0.82, 0.95] };
  const weekStart = (i) => T.sweep[0] + (i / N) * (T.sweep[1] - T.sweep[0] - T.dur);
  const weekF = (i, p) => ease((p - weekStart(i)) / T.dur);

  // ---------- render ----------
  const stage = document.getElementById('stage');
  const svgNS = 'http://www.w3.org/2000/svg';
  let p = 1;
  function render() {
    const intro = ease((p - T.intro[0]) / (T.intro[1] - T.intro[0]));
    const outro = ease((p - T.outro[0]) / (T.outro[1] - T.outro[0]));
    const front = -90 + GAP / 2 + clamp01((p - T.sweep[0]) / (T.sweep[1] - T.sweep[0] - T.dur)) * SWEEP;
    const parts = [];
    parts.push(`<svg xmlns="${svgNS}" viewBox="0 0 ${S} ${S}" role="img" aria-label="${esc(handle)} posting activity over the last ${N} weeks">`);
    parts.push(`<defs><clipPath id="av"><circle cx="${CX}" cy="${CY - 40}" r="40"/></clipPath></defs>`);
    parts.push(`<rect width="${S}" height="${S}" fill="var(--paper)"/>`);

    // gridlines (hairline, solid, one step off surface) + labels in the top gap
    parts.push(`<g opacity="${intro}">`);
    for (let k = 1; k * step <= niceMax; k++) {
      const r = R.barIn + k * step * pxPer;
      parts.push(`<circle cx="${CX}" cy="${CY}" r="${f2(r)}" fill="none" stroke="var(--rule-soft)" stroke-width="1"/>`);
      parts.push(`<text class="mono muted" x="${CX}" y="${f2(CY - r + 4)}" font-size="10" text-anchor="middle" opacity="${outro}">${k * step}</text>`);
    }
    parts.push(`<circle cx="${CX}" cy="${CY}" r="${R.barIn - 6}" fill="none" stroke="var(--rule)" stroke-width="1"/>`);
    parts.push(`</g>`);

    // month ring
    parts.push(`<g opacity="${intro}">`);
    parts.push(`<path d="${sector(R.monthIn, R.monthOut, angleOfTime(since), angleOfTime(until))}" fill="var(--bg-alt)"/>`);
    if (partial) {
      const a0 = angleOfTime(since), a1 = angleOfTime(coverStart);
      parts.push(`<path d="${sector(R.barIn - 6, R.barIn - 2, a0, a1)}" fill="var(--rule)"/>`);
      const am = (a0 + a1) / 2, [nx, ny] = pt(R.barIn + 36, am); const flip = am > 0 && am < 180;
      if (a1 - a0 > 24) parts.push(`<text class="mono muted" font-size="10" letter-spacing="0.12em" text-anchor="middle" dominant-baseline="central" transform="translate(${f2(nx)} ${f2(ny)}) rotate(${f2(am + 90 + (flip ? 180 : 0))})">NO DATA · X SHOWS ONLY THE LATEST ~3,200 ITEMS</text>`);
    }
    for (const m of months) { const a = angleOfTime(m); const [x0, y0] = pt(R.monthIn, a), [x1, y1] = pt(R.monthOut, a); parts.push(`<line x1="${f2(x0)}" y1="${f2(y0)}" x2="${f2(x1)}" y2="${f2(y1)}" stroke="var(--paper)" stroke-width="2"/>`); }
    for (const sp of monthSpans) {
      const a0 = angleOfTime(sp.from), a1 = angleOfTime(sp.to); if (a1 - a0 < 9) continue;
      const a = (a0 + a1) / 2, [x, y] = pt((R.monthIn + R.monthOut) / 2, a);
      const flip = a > 0 && a < 180; const rot = a + 90 + (flip ? 180 : 0);
      const vis = clamp01((front - a0) / Math.max(1, a1 - a0)) * (p >= T.sweep[1] ? 1 : 1);
      parts.push(`<text class="mono soft" font-size="10.5" letter-spacing="0.12em" text-anchor="middle" dominant-baseline="central" transform="translate(${f2(x)} ${f2(y)}) rotate(${f2(rot)})" opacity="${f2(Math.max(vis, p >= T.sweep[1] ? 1 : 0))}">${sp.label.toUpperCase()}</text>`);
    }
    parts.push(`</g>`);

    // engagement ring + bars
    parts.push(`<g id="weeks">`);
    for (let i = 0; i < N; i++) {
      const w = W[i], f = weekF(i, p), a = angleOfWeek(i), a0 = angleOfWeek(i, 0.06), a1 = angleOfWeek(i, 0.94);
      const hi = heatIdx(w.likes);
      if (!covered(w)) continue;                       // under the NO DATA arc: draw nothing, not zeros
      parts.push(`<g class="wk" data-i="${i}">`);
      parts.push(`<path d="${sector(R.heatIn, R.heatOut, a0, a1)}" fill="${hi < 0 ? 'var(--h0)' : HEAT[hi]}" opacity="${f2(f)}"/>`);
      let r0 = R.barIn;
      for (const t of TYPES) {
        const len = w[t] * pxPer * f; if (len <= 0.5) { r0 += len; continue; }
        const r1 = r0 + Math.max(1.5, len - SEG_GAP);
        const [x0, y0] = pt(r0, a), [x1, y1] = pt(r1, a);
        parts.push(`<line class="seg" x1="${f2(x0)}" y1="${f2(y0)}" x2="${f2(x1)}" y2="${f2(y1)}" stroke="${COLOR[t]}" stroke-width="${BAR_W}"/>`);
        r0 += len;
      }
      parts.push(`</g>`);
    }
    parts.push(`</g>`);

    // direct labels: the busiest week and the most-liked week (never a number on every bar)
    parts.push(`<g opacity="${f2(outro)}">`);
    const placed = [];
    const tip = (i, text, dy) => {
      const a = angleOfWeek(i), r = R.barIn + W[i].total * pxPer + 14; let [x, y] = pt(r, a);
      const c = Math.cos(rad(a)), right = c >= 0; const anchor = Math.abs(c) < 0.25 ? 'middle' : right ? 'start' : 'end';
      const wpx = text.length * 6.7;                                  // 11px mono estimate
      if (anchor === 'end') x = Math.max(wpx + 24, x); else if (anchor === 'start') x = Math.min(S - wpx - 24, x); else x = Math.min(S - wpx / 2 - 24, Math.max(wpx / 2 + 24, x));
      y = Math.min(1080, Math.max(180, y + (dy || 4)));             // keep clear of the corner blocks
      for (const q of placed) if (Math.abs(q.y - y) < 16 && Math.abs(q.x - x) < Math.max(wpx, q.w)) y = q.y + (y >= CY ? 16 : -16); // dodge the other label
      placed.push({ x, y, w: wpx });
      return `<text class="mono" font-size="11" text-anchor="${anchor}" x="${f2(x)}" y="${f2(y)}">${text}</text>`;
    };
    parts.push(tip(peak, `${W[peak].total} in a week · ${range(W[peak])}`));
    if (peakLikes !== peak) parts.push(tip(peakLikes, `${fmt(W[peakLikes].likes)} likes · ${range(W[peakLikes])}`));
    else parts.push(tip(peak, `${fmt(W[peak].likes)} likes`, 18));
    parts.push(`</g>`);

    // sweep hand
    if (p > T.sweep[0] && p < T.sweep[1] + T.dur) {
      const [x, y] = pt(R.barOut + 6, front), [x0, y0] = pt(R.barIn - 10, front);
      parts.push(`<line x1="${f2(x0)}" y1="${f2(y0)}" x2="${f2(x)}" y2="${f2(y)}" stroke="var(--blue)" stroke-width="1" opacity="${f2(clamp01((T.sweep[1] + T.dur - p) / 0.05))}"/>`);
    }

    // core
    const sc = 0.92 + 0.08 * intro;
    parts.push(`<g opacity="${f2(intro)}" transform="translate(${CX} ${CY}) scale(${f2(sc)}) translate(${-CX} ${-CY})">`);
    parts.push(`<circle cx="${CX}" cy="${CY}" r="${R.core}" fill="var(--core)"/>`);
    if (AVATAR) parts.push(`<image href="${AVATAR}" x="${CX - 40}" y="${CY - 80}" width="80" height="80" clip-path="url(#av)" preserveAspectRatio="xMidYMid slice"/>`);
    else parts.push(`<circle cx="${CX}" cy="${CY - 40}" r="40" fill="var(--blue)"/><text x="${CX}" y="${CY - 32}" font-size="28" font-weight="600" text-anchor="middle" style="fill:#fff">${esc((u.name || DATA.handle).slice(0, 1).toUpperCase())}</text>`);
    parts.push(`<text x="${CX}" y="${CY + 26}" font-size="19" font-weight="600" text-anchor="middle" style="fill:var(--core-text)">${esc(handle)}</text>`);
    parts.push(`<text class="mono" x="${CX}" y="${CY + 48}" font-size="10" letter-spacing="0.14em" text-anchor="middle" style="fill:var(--core-muted)">${num(total * clamp01((p - 0.1) / 0.75))} IN ${nCovered} WEEKS</text>`);
    parts.push(`<text class="mono" x="${CX}" y="${CY + 66}" font-size="10" letter-spacing="0.14em" text-anchor="middle" style="fill:var(--core-muted)">${esc(dShort((partial ? new Date(coverStart).toISOString() : DATA.since).slice(0, 10)))} → ${esc(dShort(DATA.until.slice(0, 10)))}</text>`);
    parts.push(`</g>`);

    // corner blocks
    parts.push(`<g opacity="${f2(intro)}">`);
    parts.push(`<text class="eyebrow" x="48" y="64">X · last ${N} weeks${partial ? ' · ' + nCovered + ' available' : ''}</text>`);
    parts.push(`<text x="48" y="104" font-size="34" font-weight="600" letter-spacing="-0.02em">${esc(u.name || handle)}</text>`);
    parts.push(`<text class="muted" x="48" y="130" font-size="14">${esc(handle)}${u.followers ? ' · ' + fmt(u.followers) + ' followers' : ''}${u.joined ? ' · on X since ' + new Date(u.joined).getUTCFullYear() : ''}</text>`);
    parts.push(`<text class="muted" x="48" y="152" font-size="12" opacity="${f2(outro)}">Bars grow clockwise from ${esc(dShort((partial ? new Date(coverStart).toISOString() : DATA.since).slice(0, 10)))}; length = items that week</text>`);
    if (DATA.backfill?.repostsUnavailableBefore && +new Date(DATA.backfill.repostsUnavailableBefore) > coverStart + 864e5)
      parts.push(`<text class="muted" x="48" y="172" font-size="12" opacity="${f2(outro)}">Reposts are not counted before ${esc(dShort(DATA.backfill.repostsUnavailableBefore.slice(0, 10)))} (X search does not return them)</text>`);
    parts.push(`<text x="1152" y="104" font-size="48" font-weight="600" text-anchor="end" letter-spacing="-0.02em">${num(total * clamp01((p - 0.1) / 0.75))}</text>`);
    parts.push(`<text class="mono muted" x="1152" y="128" font-size="10.5" letter-spacing="0.12em" text-anchor="end">POSTS · REPLIES · REPOSTS · QUOTES</text>`);
    parts.push(`<text class="soft" x="1152" y="152" font-size="13" text-anchor="end" opacity="${f2(outro)}">${fmt(TOT.likes)} likes · ${fmt(TOT.replies)} replies received · ${fmt(TOT.reposts)} reposts received</text>`);
    parts.push(`</g>`);

    // legend (bottom-left) — always present for 4 series
    parts.push(`<g opacity="${f2(outro)}">`);
    let lx = 48; const ly = 1110;
    for (const t of TYPES) {
      parts.push(`<rect x="${lx}" y="${ly - 10}" width="12" height="12" rx="3" fill="${COLOR[t]}"/>`);
      parts.push(`<text class="soft" x="${lx + 20}" y="${ly}" font-size="13">${LABEL[t]}</text>`);
      parts.push(`<text class="mono" x="${lx + 20 + LABEL[t].length * 7.6 + 6}" y="${ly}" font-size="12">${num(TOT[t])}</text>`);
      lx += 20 + LABEL[t].length * 7.6 + 6 + String(num(TOT[t])).length * 7.4 + 26;
    }
    parts.push(`<text class="mono muted" x="48" y="1148" font-size="10.5" letter-spacing="0.12em">INNER RING · LIKES PER WEEK</text>`);
    HEAT.forEach((c, k) => parts.push(`<rect x="${270 + k * 18}" y="1138" width="14" height="12" rx="2" fill="${c}"/>`));
    parts.push(`<text class="mono muted" x="${270 + 6 * 18 + 6}" y="1148" font-size="10.5">0 → ${fmt(maxLikes)}</text>`);
    // bottom-right: NetworkOS branding (Atlas Logo: blue mark + "networkos/" wordmark) + URL + source line
    const MARK = 26, markX = 1152 - 100 - 10 - MARK, markY = 1092 - MARK + 6;
    parts.push(`<g transform="translate(${markX} ${markY}) scale(${f2(MARK / 120)})"><rect x="0" y="0" width="120" height="120" rx="18" fill="#1F46FF"/><path d="M38 44 L52 60 L38 76" stroke="#FBFAF7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="60" y1="76" x2="84" y2="76" stroke="#FBFAF7" stroke-width="8" stroke-linecap="round"/></g>`);
    parts.push(`<text class="mono" x="1152" y="1098" font-size="17" font-weight="500" letter-spacing="-0.03em" text-anchor="end">networkos<tspan style="fill:var(--blue)">/</tspan></text>`);
    parts.push(`<text class="soft" x="1152" y="1122" font-size="13" text-anchor="end">thenetworkos.com</text>`);
    parts.push(`<text class="mono muted" x="1152" y="1148" font-size="10.5" letter-spacing="0.12em" text-anchor="end">PUBLIC POSTS VIA X.COM · ${esc(DATA.collectedAt.slice(0, 10))}</text>`);
    parts.push(`</g>`);

    // hit targets (full slot, heat ring to outer radius)
    parts.push(`<g id="hits">`);
    for (let i = 0; i < N; i++) parts.push(`<path class="hit" data-i="${i}" tabindex="0" d="${sector(R.heatIn, R.barOut, angleOfWeek(i, 0), angleOfWeek(i, 1))}"><title>${esc(range(W[i]))}: ${W[i].total} items</title></path>`);
    parts.push(`</g></svg>`);
    const old = stage.querySelector('svg'); const tipEl = document.getElementById('tip');
    if (old) old.remove();
    stage.insertAdjacentHTML('afterbegin', parts.join(''));
    stage.appendChild(tipEl);
  }

  // ---------- interaction ----------
  const tipEl = document.getElementById('tip');
  function showTip(i, ev) {
    const w = W[i];
    tipEl.innerHTML = `<b>${esc(range(w))}</b> · ${w.total} items<br>` +
      TYPES.map((t) => `<div class="row"><span><i class="k" style="background:${COLOR[t]}"></i>${LABEL[t]}</span><span>${w[t]}</span></div>`).join('') +
      `<div class="row" style="margin-top:6px"><span>Likes</span><span>${num(w.likes)}</span></div>` +
      `<div class="row"><span>Replies received</span><span>${num(w.replies)}</span></div>` +
      (w.top ? `<div class="row"><span>Top ${w.top.type}</span><span>${fmt(w.top.likes)} likes</span></div>` : '');
    tipEl.style.opacity = 1;
    const b = stage.getBoundingClientRect(); const x = ev.clientX - b.left, y = ev.clientY - b.top;
    tipEl.style.left = Math.min(b.width - 260, x + 14) + 'px'; tipEl.style.top = Math.max(0, y - 10) + 'px';
    stage.querySelectorAll('.wk').forEach((g) => (g.style.opacity = g.dataset.i == i ? 1 : 0.35));
  }
  function hideTip() { tipEl.style.opacity = 0; stage.querySelectorAll('.wk').forEach((g) => (g.style.opacity = 1)); }
  stage.addEventListener('mousemove', (e) => { const h = e.target.closest('.hit'); if (h) showTip(+h.dataset.i, e); else hideTip(); });
  stage.addEventListener('mouseleave', hideTip);
  stage.addEventListener('focusin', (e) => { const h = e.target.closest('.hit'); if (h) { const b = h.getBoundingClientRect(); showTip(+h.dataset.i, { clientX: b.left + b.width / 2, clientY: b.top + b.height / 2 }); } });
  stage.addEventListener('focusout', hideTip);

  // ---------- table twin ----------
  document.getElementById('table').innerHTML = `<table><thead><tr><th>Week</th>${TYPES.map((t) => `<th>${LABEL[t]}</th>`).join('')}<th>Total</th><th>Likes</th><th>Replies recv.</th><th>Reposts recv.</th><th>Top item</th></tr></thead><tbody>` +
    W.map((w) => `<tr><td>${esc(range(w))}</td>${TYPES.map((t) => `<td>${w[t]}</td>`).join('')}<td>${w.total}</td><td>${num(w.likes)}</td><td>${num(w.replies)}</td><td>${num(w.reposts)}</td><td>${w.top ? esc(w.top.type) + ' · ' + fmt(w.top.likes) + ' likes' : '—'}</td></tr>`).join('') + '</tbody></table>';

  // ---------- progress API ----------
  window.__chart = { setProgress(v) { p = clamp01(v); render(); return p; }, get progress() { return p; }, duration: 12 };
  if (Q.has('p')) { p = clamp01(+Q.get('p')); render(); }
  else if (Q.has('static')) { p = 1; render(); }
  else { p = 0; render(); const t0 = performance.now(); (function tick(now) { p = clamp01((now - t0) / (window.__chart.duration * 1000)); render(); if (p < 1) requestAnimationFrame(tick); })(t0); }
})();
</script>
</body>
</html>
